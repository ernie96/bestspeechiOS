name: BestSpeech
options:
  bundleIdPrefix: com.bestspeech
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1.0.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    AD_HOC_CODE_SIGNING_ALLOWED: YES

targets:
  BestSpeechVoiceExtension:
    type: app-extension
    platform: iOS
    sources:
      - Apps/BestSpeechVoiceExtension
      - path: Sources/CBestSpeech/CBestSpeech.c
      - Sources/BestSpeechKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bestspeech.VoiceExtension
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/BestSpeechVoiceExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/BestSpeechVoiceExtension/BestSpeechVoiceExtension.entitlements
        PRODUCT_NAME: BestSpeechVoiceExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Apps/BestSpeechVoiceExtension/BestSpeechVoiceExtension-Bridging-Header.h
        HEADER_SEARCH_PATHS: 
          - "$(SRCROOT)/Sources/CBestSpeech/include"
          - "$(SRCROOT)/third_party/unicorn/include"
        OTHER_LDFLAGS:
          - "-lc++"
          - "$(SRCROOT)/third_party/unicorn/build-ios/libunicorn.a"

  BestSpeechApp:
    type: application
    platform: iOS
    sources:
      - Apps/BestSpeechApp
      - path: Sources/CBestSpeech/CBestSpeech.c
      - Sources/BestSpeechKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bestspeech
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/BestSpeechApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/BestSpeechApp/BestSpeechApp.entitlements
        PRODUCT_NAME: BestSpeechApp
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Apps/BestSpeechApp/BestSpeechApp-Bridging-Header.h
        HEADER_SEARCH_PATHS: 
          - "$(SRCROOT)/Sources/CBestSpeech/include"
          - "$(SRCROOT)/third_party/unicorn/include"
        OTHER_LDFLAGS:
          - "-lc++"
          - "$(SRCROOT)/third_party/unicorn/build-ios/libunicorn.a"
    dependencies:
      - target: BestSpeechVoiceExtension
