name: BestSpeech
options:
  bundleIdPrefix: com.bestspeech
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1.0.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    AD_HOC_CODE_SIGNING_ALLOWED: YES

targets:
  SampleTTSKit:
    type: library.static
    platform: iOS
    sources:
      - Sources/CSampleTTS
      - Sources/SampleTTSKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bestspeech.kit
        PRODUCT_NAME: SampleTTSKit
        APPLICATION_EXTENSION_API_ONLY: YES
        HEADER_SEARCH_PATHS: 
          - "$(SRCROOT)/../third_party/unicorn/include"
          - "$(SRCROOT)/../c"

  SampleTTSVoiceExtension:
    type: app-extension
    platform: iOS
    sources:
      - Apps/SampleTTSVoiceExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bestspeech.app.voiceextension
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/SampleTTSVoiceExtension/Info.plist
        PRODUCT_NAME: SampleTTSVoiceExtension
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: SampleTTSKit

  SampleTTSApp:
    type: application
    platform: iOS
    sources:
      - Apps/SampleTTSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bestspeech.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/SampleTTSApp/Info.plist
        PRODUCT_NAME: BestSpeech
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: SampleTTSKit
      - target: SampleTTSVoiceExtension
