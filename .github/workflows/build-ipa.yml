name: Build BestSpeech iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App & Extension (.ipa)
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Unicorn Engine
        run: |
          # Patch pthread_jit_write_protect_np for iOS 16 SDK compatibility
          sed -i '' 's/#elif defined(__APPLE__) && __has_builtin(__builtin_available) && __builtin_available(macOS 11.2, iOS 14.2, *)/#elif 0/g' third_party/unicorn/qemu/include/qemu/osdep.h
          find third_party/unicorn -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i '' 's/defined(HAVE_PTHREAD_JIT_PROTECT)/0/g' {} +
          find third_party/unicorn -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i '' 's/#ifdef HAVE_PTHREAD_JIT_PROTECT/#if 0/g' {} +
          
          mkdir -p third_party/unicorn/build-ios
          cd third_party/unicorn/build-ios
          
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          cmake .. -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK_PATH" \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_C_FLAGS="-DHAVE_PTHREAD_JIT_PROTECT=0 -Wno-error" \
            -DCMAKE_BUILD_TYPE=Release \
            -DUNICORN_ARCH=x86
            
          ninja > unicorn_build.log 2>&1 || (cat unicorn_build.log && exit 1)

      - name: Compile BestSpeech C Backend
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iOS SDK at: $SDK_PATH"
          {
            xcrun -sdk iphoneos clang -target arm64-apple-ios16.0 -isysroot "$SDK_PATH" -c -O3 \
              -I Sources/CBestSpeech/include \
              -I third_party/unicorn/include \
              Sources/CBestSpeech/CBestSpeech.c -o CBestSpeech.o
          } > c_build.log 2>&1 || (cat c_build.log && exit 1)

      - name: Compile BestSpeech App Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -O \
            -parse-as-library \
            -module-name BestSpeechApp \
            -framework SwiftUI \
            -framework AVFoundation \
            -framework Foundation \
            -I Sources/CBestSpeech/include \
            -Xcc -ISources/CBestSpeech/include \
            -Xlinker -lc++ \
            -import-objc-header Apps/BestSpeechApp/BestSpeechApp-Bridging-Header.h \
            CBestSpeech.o third_party/unicorn/build-ios/libunicorn.a \
            Sources/BestSpeechKit/BestSpeechSynthesizer.swift \
            Sources/BestSpeechKit/BestSpeechSettings.swift \
            Sources/BestSpeechKit/BestSpeechSettingsStore.swift \
            Apps/BestSpeechApp/BestSpeechApp.swift \
            Apps/BestSpeechApp/ContentView.swift \
            -o BestSpeechAppExec > swiftc_app_build.log 2>&1 || (cat swiftc_app_build.log && exit 1)

      - name: Compile BestSpeech Voice Extension Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -O \
            -parse-as-library \
            -module-name BestSpeechVoiceExtension \
            -framework AVFoundation \
            -framework CoreMedia \
            -framework Accelerate \
            -framework Foundation \
            -framework AudioToolbox \
            -framework CoreAudio \
            -I Sources/CBestSpeech/include \
            -Xcc -ISources/CBestSpeech/include \
            -Xlinker -lc++ \
            -import-objc-header Apps/BestSpeechVoiceExtension/BestSpeechVoiceExtension-Bridging-Header.h \
            CBestSpeech.o third_party/unicorn/build-ios/libunicorn.a \
            Sources/BestSpeechKit/BestSpeechSynthesizer.swift \
            Sources/BestSpeechKit/BestSpeechSettings.swift \
            Sources/BestSpeechKit/BestSpeechSettingsStore.swift \
            Apps/BestSpeechVoiceExtension/BestSpeechAudioUnit.swift \
            -o BestSpeechVoiceExtensionExec > swiftc_ext_build.log 2>&1 || (cat swiftc_ext_build.log && exit 1)

      - name: Package Payload and Create IPA
        run: |
          mkdir -p Payload/BestSpeechApp.app/PlugIns/BestSpeechVoiceExtension.appex

          # Assemble Main App bundle
          cp BestSpeechAppExec Payload/BestSpeechApp.app/BestSpeechApp
          chmod +x Payload/BestSpeechApp.app/BestSpeechApp
          cp Apps/BestSpeechApp/Info.plist Payload/BestSpeechApp.app/Info.plist
          printf "APPL????" > Payload/BestSpeechApp.app/PkgInfo
          if [ -f b32_tts.dll ]; then cp b32_tts.dll Payload/BestSpeechApp.app/; fi
          if [ -f B32_TTS.DLL ]; then cp B32_TTS.DLL Payload/BestSpeechApp.app/; fi

          # Assemble Voice Extension bundle
          cp BestSpeechVoiceExtensionExec Payload/BestSpeechApp.app/PlugIns/BestSpeechVoiceExtension.appex/BestSpeechVoiceExtension
          chmod +x Payload/BestSpeechApp.app/PlugIns/BestSpeechVoiceExtension.appex/BestSpeechVoiceExtension
          cp Apps/BestSpeechVoiceExtension/Info.plist Payload/BestSpeechApp.app/PlugIns/BestSpeechVoiceExtension.appex/Info.plist
          if [ -f b32_tts.dll ]; then cp b32_tts.dll Payload/BestSpeechApp.app/PlugIns/BestSpeechVoiceExtension.appex/; fi
          if [ -f B32_TTS.DLL ]; then cp B32_TTS.DLL Payload/BestSpeechApp.app/PlugIns/BestSpeechVoiceExtension.appex/; fi

          # Ad-hoc sign both binaries with entitlements
          codesign -s - --force --entitlements Apps/BestSpeechVoiceExtension/BestSpeechVoiceExtension.entitlements Payload/BestSpeechApp.app/PlugIns/BestSpeechVoiceExtension.appex
          codesign -s - --force --entitlements Apps/BestSpeechApp/BestSpeechApp.entitlements Payload/BestSpeechApp.app

          # Zip into .ipa
          rm -f BestSpeechApp.ipa
          zip -r BestSpeechApp.ipa Payload
          echo "IPA created successfully: BestSpeechApp.ipa ($(wc -c < BestSpeechApp.ipa) bytes)"

      - name: Upload Logs on Failure
        if: failure()
        run: |
          cp third_party/unicorn/build-ios/unicorn_build.log unicorn_error.txt || echo "No unicorn log" > unicorn_error.txt
          cp c_build.log c_error.txt || echo "No c_build log" > c_error.txt
          cp swiftc_app_build.log app_error.txt || echo "No app log" > app_error.txt
          cp swiftc_ext_build.log ext_error.txt || echo "No ext log" > ext_error.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *_error.txt
          git commit -m "CI: Failure Logs" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Commit and Push IPA on Success
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f BestSpeechApp.ipa
          git commit -m "CI: Add built BestSpeechApp.ipa" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BestSpeech-iOS-IPA
          path: BestSpeechApp.ipa

