name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install xcodegen cmake ninja

      - name: Download iOS CMake Toolchain
        run: curl -O https://raw.githubusercontent.com/leetal/ios-cmake/master/ios.toolchain.cmake

      - name: Build unicorn for iOS
        run: |
          # Undefine the macro that enables macOS JIT code paths in QEMU
          echo "#undef HAVE_PTHREAD_JIT_PROTECT" >> third_party/unicorn/qemu/include/qemu/osdep.h
          
          mkdir -p third_party/unicorn/build-ios
          cd third_party/unicorn/build-ios
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE=../../ios.toolchain.cmake -DPLATFORM=OS64 -DBUILD_SHARED_LIBS=OFF -DUNICORN_BUILD_TESTS=OFF > unicorn_build.log 2>&1
          
          cmake --build . --config Release >> unicorn_build.log 2>&1 || (cat unicorn_build.log && exit 1)

      - name: Upload Logs on Failure
        if: failure()
        run: |
          cp third_party/unicorn/build-ios/unicorn_build.log unicorn_error.txt || echo "No unicorn log found" > unicorn_error.txt
          cp ../xcodegen.log xcodegen_error.txt || echo "No xcodegen log found" > xcodegen_error.txt
          cp ../xcodebuild.log xcodebuild_error.txt || echo "No xcodebuild log found" > xcodebuild_error.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add unicorn_error.txt xcodegen_error.txt xcodebuild_error.txt
          git commit -m "CI: Failure Logs" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen > ../xcodegen.log 2>&1 || (cat ../xcodegen.log && exit 1)

      - name: Build with xcodebuild
        run: |
          cd ios
          xcodebuild clean build \
            -project BestSpeech.xcodeproj \
            -scheme SampleTTSApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > ../xcodebuild.log 2>&1 || (cat ../xcodebuild.log && exit 1)

      - name: Package Payload and Create IPA
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R BestSpeech.app Payload/
          
          # CRITICAL STEP: Delete old IPA before zipping to prevent merged/corrupted archives
          rm -f BestSpeech.ipa
          
          # Zip into .ipa
          zip -r BestSpeech.ipa Payload
          echo "IPA created successfully"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BestSpeech-iOS-IPA
          path: ios/build/Build/Products/Release-iphoneos/BestSpeech.ipa
