name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install xcodegen cmake ninja

      - name: Build unicorn for iOS
        run: |
          mkdir -p third_party/unicorn/build-ios
          cd third_party/unicorn/build-ios
          cmake .. -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DBUILD_SHARED_LIBS=OFF -DUNICORN_BUILD_TESTS=OFF > unicorn_build.log 2>&1
          cmake --build . --config Release >> unicorn_build.log 2>&1 || (cat unicorn_build.log && exit 1)

      - name: Upload Logs on Failure
        if: failure()
        run: |
          cp third_party/unicorn/build-ios/unicorn_build.log unicorn_error.txt || echo "No log found" > unicorn_error.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add unicorn_error.txt
          git commit -m "CI: unicorn_error.txt" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen

      - name: Build with xcodebuild
        run: |
          cd ios
          xcodebuild clean build \
            -project BestSpeech.xcodeproj \
            -scheme SampleTTSApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload and Create IPA
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R BestSpeech.app Payload/
          
          # CRITICAL STEP: Delete old IPA before zipping to prevent merged/corrupted archives
          rm -f BestSpeech.ipa
          
          # Zip into .ipa
          zip -r BestSpeech.ipa Payload
          echo "IPA created successfully"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BestSpeech-iOS-IPA
          path: ios/build/Build/Products/Release-iphoneos/BestSpeech.ipa
